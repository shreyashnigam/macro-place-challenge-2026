name: RePlAce Smoke

on:
  push:
    paths:
      - ".github/workflows/replace-smoke.yml"
      - "submissions/ours/**"
      - "scripts/run_experiment.py"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "IBM benchmark to run"
        required: true
        default: "ibm01"
      timeout_seconds:
        description: "RePlAce timeout per config"
        required: true
        default: "90"

jobs:
  replace-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run RePlAce smoke
        env:
          OURS_REPLACE: "1"
          OURS_REPLACE_TIMEOUT: ${{ inputs.timeout_seconds }}
          OURS_REPLACE_MAX_CANDIDATES: "1"
          OURS_REPLACE_CONFIGS: "0.72,1.03"
        run: |
          uv run python scripts/run_experiment.py submissions/ours/placer.py \
            --benchmark "${{ inputs.benchmark }}" \
            --label "gha_replace_smoke_${{ inputs.benchmark }}"

      - name: Upload experiment records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replace-smoke-experiments
          path: experiments/
